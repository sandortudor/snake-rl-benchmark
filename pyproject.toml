[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-rl-benchmark"
version = "1.0.0"
description = "Reproducible local-compute reinforcement-learning benchmark for Snake."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tudor Karmin Sandor"}]
keywords = ["reinforcement-learning", "dqn", "snake", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.2,<3",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
snake-train = "snake_rl.train:main"
snake-evaluate = "snake_rl.evaluate_benchmark:main"
snake-report = "snake_rl.plots:main"
snake-watch = "snake_rl.visualize:main"
snake-resources = "snake_rl.benchmark_resources:main"

[tool.setuptools.packages.find]
include = ["snake_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
